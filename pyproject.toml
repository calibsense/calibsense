[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calibsense"
dynamic = ["version"]
description = "Measurement uncertainty for camera calibration: covariance, diagnosis and task-space error, not just a reprojection number"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Abhishek Gola", email = "abhishekg5422@gmail.com" }]
keywords = ["camera calibration", "uncertainty", "covariance", "metrology",
            "opencv", "photogrammetry", "computer vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Three runtime dependencies, deliberately. Everything downstream of this
# package has to survive being frozen into a single PyInstaller binary.
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
docs = ["pdoc>=14.0"]
binary = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/calibsense/calibsense"

[project.scripts]
calibsense = "calibsense.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "calibsense._version.__version__" }

[tool.setuptools.packages.find]
include = ["calibsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: multi-second statistical tests (Monte Carlo, image rendering)"]
filterwarnings = ["error::DeprecationWarning:calibsense.*"]
