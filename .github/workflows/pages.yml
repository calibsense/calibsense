# Publishes the pdoc API reference to GitHub Pages.
#
# The site is exactly what `make docs` produces, so there is one documentation
# build and it is the same one you can run locally.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment writes an environment and mints an id-token; nothing here
# touches the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the in-flight one rather than cancelling it, so a
# deployment is never left half finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package itself is installed because pdoc imports every module it
      # documents; without numpy and opencv present the import fails.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pdoc

      # PY defaults to the local .venv, which does not exist on a runner.
      - name: Build the docs
        run: make docs PY=python

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
